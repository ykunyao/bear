<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <!-- background -->
  <rect width="400" height="560" fill="#FFF8F0"/>

  <!-- long dress / skirt -->
  <path d="M200 330 C160 330 135 380 128 470 C126 500 135 515 200 515 C265 515 274 500 272 470 C265 380 240 330 200 330 Z" fill="#C97B84"/>
  <!-- dress top / torso -->
  <path d="M200 250 C185 250 178 262 178 280 L178 335 C178 348 190 355 200 355 C210 355 222 348 222 335 L222 280 C222 262 215 250 200 250 Z" fill="#C97B84"/>
  <!-- dress neckline -->
  <path d="M188 252 C195 244 205 244 212 252" stroke="#A85F68" stroke-width="4" fill="none"/>

  <!-- arms -->
  <path d="M178 275 C160 285 150 305 146 325" stroke="#E5C497" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M222 275 C240 285 250 305 254 325" stroke="#E5C497" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- hands -->
  <circle cx="146" cy="330" r="10" fill="#E5C497"/>
  <circle cx="254" cy="330" r="10" fill="#E5C497"/>

  <!-- neck -->
  <rect x="192" y="222" width="16" height="30" rx="8" fill="#E5C497"/>

  <!-- head -->
  <circle cx="200" cy="175" r="72" fill="#F2DDBB"/>

  <!-- hair: black straight shoulder-length -->
  <path d="M128 175 C124 105 160 78 200 80 C240 78 276 105 272 175 L270 245 C268 252 258 254 253 246 C247 236 240 240 233 248 C225 254 214 256 207 248 C199 256 175 256 167 248 C160 240 153 236 147 246 C142 254 132 252 130 245 Z" fill="#1B1B1B"/>
  <!-- bangs -->
  <path d="M140 130 C160 108 240 108 260 130 C250 104 220 92 200 94 C180 92 150 104 140 130 Z" fill="#1B1B1B"/>

  <!-- face -->
  <ellipse cx="200" cy="182" rx="52" ry="48" fill="#F2DDBB"/>
  <!-- blush -->
  <ellipse cx="168" cy="196" rx="10" ry="6" fill="#F2A08C" opacity="0.5"/>
  <ellipse cx="232" cy="196" rx="10" ry="6" fill="#F2A08C" opacity="0.5"/>

  <!-- eyes + glasses -->
  <circle cx="172" cy="178" r="24" fill="none" stroke="#333333" stroke-width="5"/>
  <circle cx="228" cy="178" r="24" fill="none" stroke="#333333" stroke-width="5"/>
  <path d="M196 178 L204 178" stroke="#333333" stroke-width="5"/>
  <path d="M148 176 L124 170" stroke="#333333" stroke-width="5"/>
  <path d="M252 176 L276 170" stroke="#333333" stroke-width="5"/>
  <!-- eyes -->
  <circle cx="172" cy="178" r="8" fill="#3E2B22"/>
  <circle cx="228" cy="178" r="8" fill="#3E2B22"/>
  <circle cx="175" cy="175" r="2.8" fill="#FFFFFF"/>
  <circle cx="231" cy="175" r="2.8" fill="#FFFFFF"/>

  <!-- nose -->
  <path d="M200 190 L196 196 L204 196 Z" fill="#C99B77"/>
  <!-- mouth -->
  <path d="M193 204 C197 209 203 209 207 204" stroke="#B5656A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- feet -->
  <ellipse cx="172" cy="523" rx="22" ry="9" fill="#8A5A3B"/>
  <ellipse cx="228" cy="523" rx="22" ry="9" fill="#8A5A3B"/>

  <!-- butterfly clip on hair -->
  <path d="M246 120 L262 110 L262 130 Z" fill="#D96C6C"/>
  <path d="M246 120 L230 110 L230 130 Z" fill="#D96C6C"/>
  <circle cx="246" cy="120" r="5" fill="#B85050"/>
</svg>
