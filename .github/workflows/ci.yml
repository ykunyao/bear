name: bear CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html exists
        run: test -f index.html && echo "index.html OK"
      - name: Check required elements present
        run: |
          grep -q 'id="dailyText"' index.html || (echo "missing dailyText" && exit 1)
          grep -q 'id="dayCount"' index.html || (echo "missing dayCount" && exit 1)
          echo "HTML sanity checks passed"
      - name: Check local references exist (dead-link guard)
        run: |
          grep -oE '(href|src)="[^"]+"' index.html | grep -vE 'https?://' | sed -E 's/^[a-z]+="//; s/"$//' | while read -r f; do
            if [ -n "$f" ] && [ ! -f "$f" ]; then
              echo "dead local reference: $f" && exit 1
            fi
          done
          echo "all local references OK"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
