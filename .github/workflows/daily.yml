name: bear daily update

on:
  schedule:
    # 北京时间 06:23 触发（=UTC 22:23）。刻意避开整点与零点：GitHub 对
    # schedule 是尽力而为制，热门时段排队可迟到数小时，留出提前量保证
    # 日记在 08:00 前送达。
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5

      - name: Fetch weather
        run: |
          curl -s --max-time 20 "https://wttr.in/Nanjing?format=j1" -o weather.json
          echo "weather.json fetched ($(wc -c < weather.json) bytes)"

      - name: Fetch quote
        id: quote
        run: |
          curl -s --max-time 20 "https://v1.hitokoto.cn/?c=d&c=k&encode=json" -o quote.json
          python -c "
          import json
          q = json.load(open('quote.json'))
          print(q['hitokoto'])
          print(q['from'] if q.get('from') else '')
          " > quote.txt

      - name: Build data.json
        run: |
          python - <<'PY'
          import json, subprocess, sys

          temp = subprocess.run(['python','-c','import json;print(json.load(open("weather.json"))["current_condition"][0]["temp_C"])'],capture_output=True,text=True).stdout.strip()
          code = subprocess.run(['python','-c','import json;print(json.load(open("weather.json"))["current_condition"][0]["weatherCode"])'],capture_output=True,text=True).stdout.strip()

          mapping = {
            # WWO weather codes -> category
            # Clear
            '113': 'sunny',
            # Cloudy / overcast
            '116': 'cloudy',  # Partly cloudy
            '119': 'cloudy',  # Cloudy
            '122': 'cloudy',  # Overcast
            '143': 'fog',     # Mist
            '248': 'fog',     # Fog
            '260': 'fog',     # Freezing fog
            # Rain
            '176': 'rain',    # Patchy rain
            '182': 'rain',    # Patchy sleet
            '185': 'rain',    # Patchy freezing drizzle
            '263': 'rain',    # Light drizzle
            '266': 'rain',    # Drizzle
            '281': 'rain',    # Freezing drizzle
            '284': 'rain',    # Heavy freezing drizzle
            '293': 'rain',    # Light rain
            '296': 'rain',    # Rain
            '299': 'rain',    # Heavy rain
            '302': 'rain',    # Moderate rain
            '305': 'rain',    # Heavy rain
            '308': 'rain',    # Heavy rain
            '311': 'rain',    # Freezing rain
            '314': 'rain',    # Light freezing rain
            '317': 'rain',    # Light sleet
            '320': 'rain',    # Sleet
            '350': 'snow',    # Ice pellets
            '353': 'rain',    # Light rain shower
            '356': 'rain',    # Moderate/heavy rain shower
            '359': 'rain',    # Torrential rain shower
            '362': 'rain',    # Light sleet shower
            '365': 'rain',    # Moderate/heavy sleet shower
            '377': 'rain',    # Hail shower
            '392': 'rain',    # Mixed rain/snow shower
            # Snow
            '179': 'snow',    # Patchy snow
            '227': 'snow',    # Blowing snow
            '230': 'snow',    # Blizzard
            '323': 'snow',    # Light snow
            '326': 'snow',    # Light snow
            '329': 'snow',    # Moderate snow
            '332': 'snow',    # Heavy snow
            '335': 'snow',    # Heavy snow
            '338': 'snow',    # Heavy snow
            '368': 'snow',    # Light snow shower
            '371': 'snow',    # Moderate/heavy snow shower
            '374': 'snow',    # Ice pellets shower
            '395': 'snow',    # Heavy snow
            # Thunderstorm
            '200': 'thunder', # Thunderstorm
            '386': 'thunder', # Thunderstorm
            '389': 'thunder', # Heavy thunderstorm
          }
          weather = mapping.get(code, 'cloudy')

          with open('quote.txt') as f:
              lines = [l.strip() for l in f if l.strip()]
          sentence = lines[0] if lines else '今天也要元气满满地生活！'
          source = lines[1] if len(lines) > 1 else ''

          data = {
            'weather': weather,
            'temp': temp,
            'text': f'今天想说：{sentence}' + (f' —— {source}' if source else ''),
            'updated_at': __import__('datetime').date.today().isoformat()
          }
          json.dump(data, open('data.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print('data.json written:', data)
          PY

      - name: Cleanup temp files
        run: rm -f weather.json quote.json quote.txt

      - name: Commit and push via PR (auto-merge after CI passes)
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          if [ -z "$(git status --porcelain data.json)" ]; then
            echo "No change in data.json, skipping"
            exit 0
          fi

          git config user.name "bear-updater[bot]"
          git config user.email "bear-updater@users.noreply.github.com"

          BRANCH="bot/daily-update"
          git checkout -b "$BRANCH"
          git add data.json
          git commit -m "daily: update bear's diary ($(date +%F))"

          git push --force origin "$BRANCH"

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "daily: update bear's diary ($(date +%F))" \
            --body "Automated daily update of data.json." || true

          gh pr merge --repo "$GITHUB_REPOSITORY" "$BRANCH" --auto --merge --delete-branch || true
