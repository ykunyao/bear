name: bear daily update

on:
  schedule:
    # 北京时间 06:23 触发（=UTC 22:23）。刻意避开整点与零点：GitHub 对
    # schedule 是尽力而为制，热门时段排队可迟到数小时，留出提前量保证
    # 日记在 08:00 前送达。
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5

      - name: Fetch weather
        run: |
          # wttr.in 的 TLS 证书验证曾长期失败（curl exit 60），改用 Open-Meteo（免 Key，WMO 标准天气码）
          curl -s --retry 3 --retry-delay 5 --max-time 20 \
            "https://api.open-meteo.com/v1/forecast?latitude=32.06&longitude=118.78&current=temperature_2m,weather_code" \
            -o weather.json
          echo "weather.json fetched ($(wc -c < weather.json) bytes)"

      - name: Fetch quote
        id: quote
        run: |
          curl -s --max-time 20 "https://v1.hitokoto.cn/?c=d&c=k&encode=json" -o quote.json
          python -c "
          import json
          q = json.load(open('quote.json'))
          print(q['hitokoto'])
          print(q['from'] if q.get('from') else '')
          " > quote.txt

      - name: Build data.json
        run: |
          python - <<'PY'
          import json

          current = json.load(open('weather.json'))['current']
          temp = str(round(current['temperature_2m']))
          code = current['weather_code']

          mapping = {
            # WMO weather codes -> category
            # Clear / mainly clear
            0: 'sunny',
            1: 'sunny',
            # Partly cloudy / overcast
            2: 'cloudy',
            3: 'cloudy',
            # Fog
            45: 'fog',
            48: 'fog',
            # Drizzle
            51: 'rain', 53: 'rain', 55: 'rain',
            56: 'rain', 57: 'rain',
            # Rain
            61: 'rain', 63: 'rain', 65: 'rain',
            66: 'rain', 67: 'rain',
            # Snow
            71: 'snow', 73: 'snow', 75: 'snow', 77: 'snow',
            # Showers
            80: 'rain', 81: 'rain', 82: 'rain',
            85: 'snow', 86: 'snow',
            # Thunderstorm
            95: 'thunder', 96: 'thunder', 99: 'thunder',
          }
          weather = mapping.get(code, 'cloudy')

          with open('quote.txt') as f:
              lines = [l.strip() for l in f if l.strip()]
          sentence = lines[0] if lines else '今天也要元气满满地生活！'
          source = lines[1] if len(lines) > 1 else ''
          if len(source) > 24:
              source = source[:24] + '…'

          data = {
            'weather': weather,
            'temp': temp,
            'text': sentence,
            'from': source,
            'updated_at': __import__('datetime').date.today().isoformat()
          }
          json.dump(data, open('data.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print('data.json written:', data)
          PY

      - name: Cleanup temp files
        run: rm -f weather.json quote.json quote.txt

      - name: Commit and push via PR (auto-merge after CI passes)
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          if [ -z "$(git status --porcelain data.json)" ]; then
            echo "No change in data.json, skipping"
            exit 0
          fi

          git config user.name "bear-updater[bot]"
          git config user.email "bear-updater@users.noreply.github.com"

          BRANCH="bot/daily-update"
          git checkout -b "$BRANCH"
          git add data.json
          git commit -m "daily: update bear's diary ($(date +%F))"

          git push --force origin "$BRANCH"

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "daily: update bear's diary ($(date +%F))" \
            --body "Automated daily update of data.json." || true

          gh pr merge --repo "$GITHUB_REPOSITORY" "$BRANCH" --auto --merge --delete-branch || true
