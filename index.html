<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear 的今日日记</title>
<style>
  :root {
    --paper: #F3EBD8;
    --paper-2: #EDE3CC;
    --ink: #3D3528;
    --ink-soft: #6E6350;
    --accent: #B0432E;
    --line: #CDBFa2;
    --shadow: 0 14px 34px rgba(61, 53, 40, .20);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 30% 20%, rgba(61,53,40,.04), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(61,53,40,.05), transparent 55%);
    color: var(--ink);
    font-family: "Courier New", "Lucida Console", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.5rem;
  }
  .sheet {
    width: 100%;
    max-width: 600px;
    background: var(--paper-2);
    border-radius: 4px;
    box-shadow: var(--shadow);
    position: relative;
    padding: 2.6rem 2.2rem 2rem;
  }
  /* top binder holes + red margin line like a typewriter page */
  .sheet::before {
    content: "";
    position: absolute;
    top: 14px; left: 0; right: 0;
    height: 18px;
    background: transparent;
    background-image:
      radial-gradient(circle at 24px center, #F3EBD8 0 6px, transparent 7px),
      radial-gradient(circle at calc(50% - 0px) center, #F3EBD8 0 6px, transparent 7px),
      radial-gradient(circle at calc(100% - 24px) center, #F3EBD8 0 6px, transparent 7px);
  }
  .sheet::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 58px;
    border-right: 2px solid rgba(176, 67, 46, .55);
    pointer-events: none;
  }
  .tape {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 150px;
    height: 26px;
    background: rgba(222, 197, 156, .55);
    border-left: 1px dashed rgba(120, 100, 70, .35);
    border-right: 1px dashed rgba(120, 100, 70, .35);
    box-shadow: 0 2px 6px rgba(61, 53, 40, .10);
    pointer-events: none;
  }
  .type-line {
    position: relative;
    margin-bottom: 1.15rem;
    color: var(--ink-soft);
    font-size: .8rem;
    letter-spacing: .1em;
  }
  .type-line .stamp {
    color: var(--accent);
    font-weight: bold;
  }
  .masthead {
    text-align: center;
    margin: .4rem 0 1.4rem;
  }
  .masthead .avatar {
    font-size: 3rem;
    line-height: 1.2;
    margin-bottom: .5rem;
  }
  h1 {
    font-family: "Courier New", monospace;
    font-size: 1.6rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
  }
  h1::before { content: "· "; color: var(--accent); }
  h1::after { content: " ·"; color: var(--accent); }
  .subtitle {
    margin-top: .4rem;
    font-size: .78rem;
    color: var(--ink-soft);
    letter-spacing: .12em;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .6rem;
    font-size: .78rem;
    color: var(--ink-soft);
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    padding: .6rem 0;
    margin-bottom: 1.1rem;
  }
  .meta .m-label { letter-spacing: .08em; }
  .meta .m-label b { color: var(--ink); font-weight: bold; }
  .greeting {
    text-align: center;
    font-size: .9rem;
    color: var(--accent);
    margin-bottom: .8rem;
    letter-spacing: .04em;
  }
  .diary {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 1.3rem 1.4rem;
    margin-bottom: 1.2rem;
    min-height: 120px;
    box-shadow: inset 0 0 0 3px var(--paper-2), inset 0 0 0 4px var(--line);
  }
  .diary .label {
    position: absolute;
    top: -11px;
    left: 12px;
    background: var(--paper-2);
    padding: 0 .6rem;
    font-size: .72rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .daily-text {
    font-size: .98rem;
    line-height: 2;
    color: var(--ink);
  }
  .type-end {
    text-align: center;
    font-size: .78rem;
    color: var(--ink-soft);
    letter-spacing: .3em;
    margin-bottom: .8rem;
  }
  .paws {
    text-align: center;
    font-size: 1rem;
    letter-spacing: .5em;
    color: #B7A989;
    margin-bottom: .4rem;
  }
  .paws span {
    display: inline-block;
    transition: transform .25s ease;
    cursor: default;
    animation: pawStep 2.6s ease-in-out infinite;
  }
  .paws span:nth-child(2) { animation-delay: .45s; }
  .paws span:nth-child(3) { animation-delay: .9s; }
  .paws span:nth-child(4) { animation-delay: 1.35s; }
  .paws span:nth-child(5) { animation-delay: 1.8s; }
  .paws span:hover { transform: scale(1.3); }
  @keyframes pawStep {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  footer {
    margin-top: .8rem;
    font-size: .7rem;
    color: #B3A182;
    letter-spacing: .08em;
    text-align: center;
  }
  .note {
    text-align: center;
    font-size: .72rem;
    color: #B3A182;
    letter-spacing: .12em;
    margin-top: .9rem;
  }
  @media (max-width: 480px) {
    .sheet { padding: 2.2rem 1.3rem 1.6rem; }
    h1 { font-size: 1.25rem; }
    .daily-text { font-size: .9rem; }
    .meta { font-size: .72rem; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="tape" aria-hidden="true"></div>
    <div class="type-line">REC. NO. <span class="stamp">#<span id="dayCount">1</span></span></div>

    <div class="masthead">
      <div class="avatar" id="avatar" aria-label="Bear">👧</div>
      <h1>Bear 的今日日记</h1>
      <p class="subtitle">— 一只叫 Bear 的女孩，每天醒来写一行字 —</p>
    </div>

    <div class="meta">
      <span class="m-label">DATE <b id="dateLabel">----</b></span>
      <span class="m-label">WX <b id="weatherTag">----</b> <span id="weatherIcon"></span></span>
    </div>

    <div class="greeting" id="greeting"></div>

    <div class="diary">
      <span class="label">今日日记</span>
      <p class="daily-text" id="dailyText">今天的日记还在路上，等 Actions 叫醒我以后写给你。</p>
    </div>

    <div class="type-end">··· END OF PAGE ···</div>

    <div class="paws" aria-hidden="true">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>

    <div class="note">— faithfully archived · with GitHub Actions —</div>
  </div>

<script>
(function () {
  var LAUNCH = new Date(2026, 7, 26); /* 2026-08-26 */
  var now = new Date();
  var hour = now.getHours();
  var today = new Date(now);
  today.setHours(0, 0, 0, 0);
  var dayCount = Math.max(1, Math.floor((today - LAUNCH) / 86400000) + 1);
  document.getElementById('dayCount').textContent = dayCount;

  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('dateLabel').textContent =
    months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();

  var avatarEl = document.getElementById('avatar');
  var greetingEl = document.getElementById('greeting');
  var weatherIconEl = document.getElementById('weatherIcon');
  var weatherTagEl = document.getElementById('weatherTag');

  var avatars = { 'sunny':'😊', 'cloudy':'😌', 'rain':'😴', 'snow':'❄️', 'default':'👧' };
  var weatherIcons = { 'sunny':'☀', 'cloudy':'☁', 'rain':'☂', 'snow':'❅' };

  function setTimeGreeting() {
    var emoji, text;
    if (hour >= 6 && hour < 12) {
      emoji = '☀'; text = 'MORNING — Bear 刚醒，今天精神满满';
    } else if (hour >= 12 && hour < 19) {
      emoji = '◐'; text = 'AFTERNOON — 午后最适合来杯咖啡';
    } else if (hour >= 19) {
      emoji = '☾'; text = 'EVENING — 今天辛苦啦，早点休息';
    } else {
      emoji = '✕'; text = 'MIDNIGHT — Bear 已经睡死过去了';
    }
    avatarEl.textContent = emoji;
    greetingEl.textContent = text;
  }
  setTimeGreeting();

  var weatherMoodText = {
    'sunny': 'CLEAR',
    'cloudy': 'CLOUDY',
    'rain': 'RAIN',
    'snow': 'SNOW'
  };

  fetch('data.json')
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (data) {
      avatarEl.textContent = avatars[data.weather] || avatars['default'];
      weatherIconEl.textContent = weatherIcons[data.weather] || '';
      weatherTagEl.textContent = (weatherMoodText[data.weather] || '?') + ' ' + (data.temp != null ? data.temp + '°' : '');
      if (data.text) document.getElementById('dailyText').textContent = data.text;
      document.title = 'Bear 的今日日记 · ' + (data.text || '');
    })
    .catch(function () {
      /* no data.json yet — keep defaults */
    });
})();
</script>
</body>
</html>
